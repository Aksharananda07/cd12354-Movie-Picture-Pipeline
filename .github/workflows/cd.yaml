name: Continuous Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 145627859766.dkr.ecr.us-east-1.amazonaws.com
  BACKEND_REPOSITORY: backend
  FRONTEND_REPOSITORY: frontend
  EKS_CLUSTER_NAME: cluster

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        working-directory: starter/backend
        run: |
          docker build -t $ECR_REGISTRY/$BACKEND_REPOSITORY:${GITHUB_SHA} .
          docker push $ECR_REGISTRY/$BACKEND_REPOSITORY:${GITHUB_SHA}

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $EKS_CLUSTER_NAME

      - name: Deploy backend
        run: |
          kubectl apply -k starter/backend/k8s
          kubectl set image deployment/backend \
            backend=$ECR_REGISTRY/$BACKEND_REPOSITORY:${GITHUB_SHA}
          kubectl rollout status deployment/backend --timeout=5m

      - name: Get backend LoadBalancer URL
        id: backend-url
        run: |
          for i in {1..30}; do
            BACKEND_URL=$(kubectl get service backend \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
            if [ -n "$BACKEND_URL" ]; then
              echo "url=http://$BACKEND_URL" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "Backend LoadBalancer URL was not assigned."
          exit 1

      - name: Build and push frontend image
        working-directory: starter/frontend
        env:
          REACT_APP_MOVIE_API_URL: ${{ steps.backend-url.outputs.url }}
        run: |
          docker build \
            --build-arg REACT_APP_MOVIE_API_URL="$REACT_APP_MOVIE_API_URL" \
            -t $ECR_REGISTRY/$FRONTEND_REPOSITORY:${GITHUB_SHA} .
          docker push $ECR_REGISTRY/$FRONTEND_REPOSITORY:${GITHUB_SHA}

      - name: Deploy frontend
        run: |
          kubectl apply -k starter/frontend/k8s
          kubectl set image deployment/frontend \
            frontend=$ECR_REGISTRY/$FRONTEND_REPOSITORY:${GITHUB_SHA}
          kubectl rollout status deployment/frontend --timeout=5m

      - name: Verify deployment
        run: |
          kubectl get deployments
          kubectl get pods
          kubectl get services
